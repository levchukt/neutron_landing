<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>NEUTRON School — тест на профорієнтацію</title>
    <link rel="canonical" href="https://neutronschool.com.ua/quiz/">
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <!-- Переадресація на тест із міткою джерела. Скрипт спрацьовує одразу,
         meta refresh лишається запасним варіантом, якщо JS вимкнений.
         location.replace, а не href — щоб кнопка «назад» не поверталась сюди. -->
    <script>location.replace('/quiz/?utm_source=shkola');</script>
    <meta http-equiv="refresh" content="0; url=/quiz/?utm_source=shkola">
    <style>
        html, body { margin: 0; height: 100%; }
        body {
            background: #2A3F5F; color: #fff;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            display: flex; align-items: center; justify-content: center;
            text-align: center; padding: 24px; box-sizing: border-box;
        }
        p { font-size: 17px; line-height: 1.6; margin: 0; }
        a { color: #FF6B35; font-weight: 700; }
    </style>
</head>
<body>
    <p>
        Відкриваємо тест…<br>
        <a href="/quiz/?utm_source=shkola">Якщо нічого не сталось — натисніть сюди</a>
    </p>
</body>
</html>
